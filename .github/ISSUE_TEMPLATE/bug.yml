name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `widgora version`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How Widgora runs (LXC, container, bare metal), OS, browser if it is a UI problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove addresses, host names and tokens you do not want to share.
      render: text
